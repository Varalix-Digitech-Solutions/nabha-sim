  </defs>

  <!-- icon: faceted cloud + broadcast waves + device nodes -->
  <g transform="translate(6 13) scale(1.05)">
    <g fill="none" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round">
      <path d="M63 39 a16 16 0 0 1 0 18" opacity="0.8"/>
      <path d="M69 32 a27 27 0 0 1 0 32" opacity="0.45"/>
    </g>
    <polygon points="10,45 18,30 30,28 35,18 45,22 55,28 60,38 55,50 45,55 30,58 18,52" fill="url(#brand)"/>
    <line x1="35" y1="18" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="45" y1="22" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="55" y1="28" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="55" y1="50" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <circle cx="35" cy="38" r="6" fill="white" opacity="0.20"/>
    <circle cx="35" cy="38" r="3" fill="white"/>
    <circle cx="35" cy="18" r="2.6" fill="white"/>
    <circle cx="55" cy="28" r="2" fill="white" opacity="0.85"/>
    <circle cx="55" cy="50" r="2" fill="white" opacity="0.65"/>
  </g>

  <!-- wordmark -->
  <text x="92" y="52" font-size="40" font-weight="800" letter-spacing="-1.5" fill="url(#wm)">nabha-sim</text>
  <text x="94" y="76" font-size="14" font-weight="600" letter-spacing="3" fill="#64748b">DEVICE SIMULATOR</text>
