<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" font-family="'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e2a44" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <rect width="1280" height="460" fill="none" stroke="#1f2b45" stroke-width="2"/>

  <!-- ===== left: faceted cloud icon with broadcast waves ===== -->
  <g transform="translate(150 150) scale(2.55)">
    <!-- broadcast signal rings -->
    <g fill="none" stroke="#2dd4bf" stroke-width="1.4" stroke-linecap="round">
      <path d="M64 40 a18 18 0 0 1 0 20" opacity="0.75"/>
      <path d="M70 33 a30 30 0 0 1 0 34" opacity="0.45"/>
      <path d="M76 26 a42 42 0 0 1 0 48" opacity="0.22"/>
    </g>
    <!-- faceted cloud (nabha family shape) -->
    <polygon points="10,45 18,30 30,28 35,18 45,22 55,28 60,38 55,50 45,55 30,58 18,52" fill="url(#brand)"/>
    <line x1="30" y1="28" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="35" y1="18" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="45" y1="22" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="55" y1="28" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="55" y1="50" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.30"/>
    <line x1="30" y1="58" x2="35" y2="40" stroke="white" stroke-width="0.5" opacity="0.20"/>
    <circle cx="35" cy="38" r="6" fill="white" opacity="0.20"/>
    <circle cx="35" cy="38" r="3" fill="white"/>
    <!-- device nodes at vertices -->
    <circle cx="35" cy="18" r="2.6" fill="white"/>
    <circle cx="55" cy="28" r="2" fill="white" opacity="0.85"/>
    <circle cx="55" cy="50" r="2" fill="white" opacity="0.65"/>
    <circle cx="18" cy="30" r="1.8" fill="#2dd4bf"/>
    <circle cx="18" cy="52" r="1.8" fill="#2dd4bf" opacity="0.8"/>
  </g>

  <!-- ===== right: wordmark + copy ===== -->
  <g transform="translate(560 0)">
    <text x="0" y="176" font-size="86" font-weight="800" letter-spacing="-2" fill="#f8fafc">nabha<tspan fill="url(#brandText)">-sim</tspan></text>
    <text x="4" y="224" font-size="27" font-weight="600" fill="#93c5fd">The device simulator for nabha-cloud</text>
    <text x="4" y="262" font-size="19" fill="#94a3b8">Model a whole IoT fleet — gateways, sub-devices, per-point datatypes —</text>
    <text x="4" y="288" font-size="19" fill="#94a3b8">and stream it straight into nabha-cloud, in 11 payload formats.</text>

    <!-- feature pills -->
    <g font-size="15" font-weight="600" fill="#cbd5e1">
      <g transform="translate(4 320)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#13203a" stroke="#2b3a5c"/>
        <text x="75" y="22" text-anchor="middle">Gateway hierarchy</text>
      </g>
      <g transform="translate(166 320)">
        <rect x="0" y="0" width="132" height="34" rx="17" fill="#13203a" stroke="#2b3a5c"/>
        <text x="66" y="22" text-anchor="middle">COV · Periodic</text>
      </g>
      <g transform="translate(310 320)">
        <rect x="0" y="0" width="110" height="34" rx="17" fill="#13203a" stroke="#2b3a5c"/>
        <text x="55" y="22" text-anchor="middle">TLS · LWT</text>
      </g>
      <g transform="translate(432 320)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#13203a" stroke="#2b3a5c"/>
        <text x="75" y="22" text-anchor="middle">Web UI + REST/CLI</text>
      </g>
    </g>
  </g>

  <!-- ===== developed-by credit (bottom-right) ===== -->
  <g transform="translate(946 398)">
    <text x="0" y="14" font-size="14" fill="#64748b">Developed by</text>
    <g transform="translate(96 -6) scale(0.62)">
      <path d="M8 10 L28 50 L48 10" stroke="url(#vgrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="28" y1="50" x2="28" y2="56" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="10" x2="2" y2="10" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
      <line x1="48" y1="10" x2="54" y2="10" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      <circle cx="8" cy="10" r="3" fill="#6366f1"/>
      <circle cx="48" cy="10" r="3" fill="#22d3ee"/>
      <circle cx="28" cy="50" r="4" fill="#22d3ee"/>
      <circle cx="28" cy="30" r="2" fill="#8b5cf6"/>
      <text x="70" y="32" font-size="24" font-weight="700" fill="#22d3ee">Varalix</text>
      <text x="152" y="32" font-size="24" font-weight="400" fill="#e2e8f0">Digitech</text>
      <text x="70" y="50" font-size="10" letter-spacing="2" fill="#94a3b8">SOLUTIONS</text>
    </g>
  </g>
</svg>
